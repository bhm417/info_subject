<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중1 정보 AI 퀴즈</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: 'Malgun Gothic', sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .quiz-card { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
    h2 { color: #333; margin-bottom: 20px; }
    input[type="text"] { width: 80%; padding: 15px; font-size: 20px; border: 2px solid #ddd; border-radius: 12px; margin-bottom: 20px; text-align: center; }
    .btn { width: 100%; min-height: 60px; font-size: 20px; border: none; border-radius: 12px; background: #4F46E5; color: white; cursor: pointer; margin-top: 10px; font-weight: bold; }
    .btn:active { background: #3730A3; }
    .option-btn { background: #F3F4F6; color: #1F2937; margin-bottom: 12px; text-align: left; padding: 15px 20px; border: 2px solid #E5E7EB; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="quiz-card">
  <!-- 1. 학번 입력 화면 -->
  <div id="start-screen">
    <h2>🤖 AI 인공지능 퀴즈</h2>
    <p style="font-size: 18px; color: #666;">학번을 입력하고 시작하세요!</p>
    <input type="text" id="student-id" placeholder="예: 10101 (1학년 1반 1번)" autocomplete="off">
    <button class="btn" onclick="startQuiz()">퀴즈 시작하기</button>
  </div>

  <!-- 2. 퀴즈 화면 -->
  <div id="quiz-screen" class="hidden">
    <h3 id="question-number" style="color: #4F46E5;"></h3>
    <h2 id="question-text"></h2>
    <div id="options-container"></div>
  </div>

  <!-- 3. 결과 화면 -->
  <div id="result-screen" class="hidden">
    <h2>🎉 퀴즈 완료!</h2>
    <p id="score-text" style="font-size: 24px; font-weight: bold; color: #10B981;"></p>
    <p id="status-text" style="font-size: 18px; color: #666;">결과를 선생님에게 제출하는 중...</p>
  </div>
</div>

<script>
  // ⚠️ 여기에 1단계에서 복사한 구글 앱스 스크립트 URL을 넣으세요!
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwEVMXlgs18sWRr-UTqYxXjzddxhxStwrHlCFy-jIPpv4Sl2Cd94G8mUPXpiBQyUps/exec";

  const questions = [
    { q: "다음 중 인공지능(AI)의 정의로 가장 알맞은 것은?", options: ["사람처럼 생각하고 학습하는 컴퓨터 시스템", "화면을 밝게 해주는 장치", "인터넷 속도를 빠르게 하는 기술", "전기를 절약해주는 장치"], answer: 0 },
    { q: "AI가 데이터를 바탕으로 스스로 학습하는 기술을 무엇이라 할까요?", options: ["머신러닝(기계학습)", "빅데이터", "클라우드", "네트워크"], answer: 0 },
    { q: "다음 중 인공지능이 활용된 사례가 아닌 것은?", options: ["자율주행 자동차", "음성인식 비서 (시리, 비스비 등)", "수동으로 켜는 단전 스위치", "AI 얼굴 인식 로그인"], answer: 2 },
    { q: "챗GPT와 같이 텍스트나 이미지를 새롭게 만들어내는 AI를 무엇이라 할까요?", options: ["생성형 AI", "파괴형 AI", "보존형 AI", "수동형 AI"], answer: 0 },
    { q: "올바른 AI 활용 태도로 가장 바람직한 것은?", options: ["AI가 만든 답변은 확인 없이 그대로 사용한다.", "AI를 개인정보 침해나 악용 목적으로 쓰지 않는다.", "AI가 만든 저작물은 모두 내 것이라고 주장한다.", "숙제를 할 때 AI가 써준 글을 그대로 제출한다."], answer: 1 }
  ];

  let currentQuiz = 0;
  let score = 0;
  let studentId = "";

  function startQuiz() {
    studentId = document.getElementById("student-id").value.trim();
    if (!studentId) {
      alert("학번을 입력해 주세요!");
      return;
    }
    document.getElementById("start-screen").classList.add("hidden");
    document.getElementById("quiz-screen").classList.remove("hidden");
    loadQuestion();
  }

  function loadQuestion() {
    const q = questions[currentQuiz];
    document.getElementById("question-number").innerText = `문제 ${currentQuiz + 1} / ${questions.length}`;
    document.getElementById("question-text").innerText = q.q;

    // 보기 셔플
    let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
    optionsWithIndex.sort(() => Math.random() - 0.5);

    const container = document.getElementById("options-container");
    container.innerHTML = "";

    optionsWithIndex.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "btn option-btn";
      btn.innerText = opt.text;
      btn.onclick = () => selectAnswer(opt.isCorrect);
      container.appendChild(btn);
    });
  }

  function selectAnswer(isCorrect) {
    if (isCorrect) score++;
    currentQuiz++;

    if (currentQuiz < questions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");
    document.getElementById("score-text").innerText = `${studentId}님은 5문제 중 ${score}문제를 맞혔습니다!`;

    // 구글 시트로 데이터 전송
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ studentId: studentId, score: score })
    }).then(() => {
      document.getElementById("status-text").innerText = "선생님 시트에 성공적으로 제출되었습니다! 🎉";
    }).catch(() => {
      document.getElementById("status-text").innerText = "제출 중 오류가 발생했습니다.";
    });
  }
</script>

</body>
</html>
